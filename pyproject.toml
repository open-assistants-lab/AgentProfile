[project]
name = "agentprofile"
version = "0.2.0"
description = "Portable agent profile definition — schema and parser"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
